<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha · UNIFOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --azul: #003366;
    --azul-destaque: #0056b3;
    --laranja: #d97706;
    --fundo: #f4f6f9;
    --papel: #ffffff;
    --linha: #d7dee7;
    --texto-suave: #5b6b7d;
    --grade-opacidade: 0.035;
  }

  html.escuro{
    --azul: #e8eef7;
    --azul-destaque: #6fa8ff;
    --laranja: #f0a94e;
    --fundo: #0d1420;
    --papel: #131c2b;
    --linha: #263349;
    --texto-suave: #8fa0b8;
    --grade-opacidade: 0.08;
  }

  *{ box-sizing:border-box; }

  html{ color-scheme: light; }
  html.escuro{ color-scheme: dark; }

  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(var(--fundo), var(--fundo)),
      repeating-linear-gradient(0deg, rgba(0,51,102,var(--grade-opacidade)) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(0,51,102,var(--grade-opacidade)) 0 1px, transparent 1px 32px);
    font-family:'IBM Plex Mono', monospace;
    color:var(--azul);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 80px;
    transition: background-color .25s ease, color .25s ease;
  }

  body, .folha, .campo, select, .celula, .rodada .valor, button#reiniciar{
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }

  .folha{
    width:100%;
    max-width:560px;
    background:var(--papel);
    border:1px solid var(--linha);
    box-shadow: 0 1px 0 var(--linha), 0 24px 48px -32px rgba(0,51,102,0.35);
  }

  header{
    padding:28px 32px 22px;
    border-bottom:2px solid var(--azul);
    position:relative;
  }
  .alterna-tema{
    position:absolute;
    top:20px; right:20px;
    width:34px; height:34px;
    border:1px solid var(--linha);
    background:var(--fundo);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    color:var(--azul);
    padding:0;
  }
  .alterna-tema:hover{ border-color:var(--azul-destaque); }
  .alterna-tema:focus-visible{ outline:2px solid var(--azul-destaque); outline-offset:2px; }

  .eyebrow{
    font-size:11px;
    letter-spacing:2.5px;
    color:var(--azul-destaque);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px;
    font-weight:700;
    letter-spacing:0.5px;
    margin:0;
    color:var(--azul);
  }

  .controles{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:1px;
    background:var(--linha);
    border-bottom:1px solid var(--linha);
  }
  .campo{
    background:var(--papel);
    padding:14px 18px;
    transition: opacity .2s ease;
  }
  .campo.oculto{
    display:none;
  }
  .campo label{
    display:block;
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--texto-suave);
    margin-bottom:6px;
    font-weight:600;
  }
  select{
    width:100%;
    border:1px solid var(--linha);
    background:var(--fundo);
    color:var(--azul);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:500;
    padding:8px 10px;
    border-radius:2px;
    cursor:pointer;
  }
  select:focus-visible{
    outline:2px solid var(--azul-destaque);
    outline-offset:1px;
  }

  .placar{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:22px 32px 8px;
  }
  .jogador{ text-align:center; }
  .jogador .rotulo{
    font-size:11px;
    letter-spacing:1.5px;
    font-weight:600;
    color:var(--texto-suave);
    margin-bottom:4px;
  }
  .jogador.x .rotulo{ color:var(--azul-destaque); }
  .jogador.o .rotulo{ color:var(--laranja); }
  .jogador .valor{
    font-family:'Space Grotesk',sans-serif;
    font-size:38px;
    font-weight:700;
    line-height:1;
  }
  .jogador.x .valor{ color:var(--azul); }
  .jogador.o .valor{ color:var(--laranja); }
  .jogador.ativo .valor{
    text-decoration: underline;
    text-decoration-color: currentColor;
    text-decoration-thickness: 3px;
    text-underline-offset: 6px;
  }
  .rodada{
    text-align:center;
    padding:0 18px;
  }
  .rodada .rotulo{
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--texto-suave);
    font-weight:600;
    margin-bottom:4px;
  }
  .rodada .valor{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--azul);
    border:1px solid var(--linha);
    border-radius:2px;
    padding:2px 10px;
    background:var(--fundo);
  }

  .status{
    text-align:center;
    padding:6px 16px 18px;
    font-size:14px;
    font-weight:500;
    color:var(--azul);
    min-height:20px;
    letter-spacing:0.2px;
  }
  .status.vitoria{ color:var(--laranja); font-weight:600; }
  .status.empate{ color:var(--texto-suave); font-weight:600; }

  .tabuleiro-wrap{
    padding:4px 32px 28px;
    position:relative;
  }
  .tabuleiro{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    aspect-ratio:1/1;
  }
  .celula{
    background:var(--fundo);
    border:1px solid var(--linha);
    border-radius:3px;
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(32px, 9vw, 52px);
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--azul);
    transition: background .15s ease, transform .1s ease;
    user-select:none;
  }
  .celula:hover:not(.ocupada){
    background:#e9eef4;
  }
  .celula:focus-visible{
    outline:2px solid var(--azul-destaque);
    outline-offset:-2px;
  }
  .celula.ocupada{ cursor:default; }
  .celula[data-s="O"]{ color:var(--laranja); }
  .celula.marcando{ animation: pop .18s ease; }
  @keyframes pop{ from{ transform:scale(0.7); } to{ transform:scale(1); } }

  .linha-vitoria{
    position:absolute;
    height:6px;
    border-radius:3px;
    background:var(--laranja);
    left:0; top:0;
    width:0;
    transform-origin:left center;
    opacity:0;
    box-shadow:0 0 0 3px rgba(217,119,6,0.15);
    pointer-events:none;
  }
  .linha-vitoria.ativa{
    opacity:1;
    transition: width .35s ease;
  }

  .rodape{
    padding:20px 32px 28px;
    border-top:1px solid var(--linha);
    display:flex;
    justify-content:center;
  }
  button#reiniciar{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--papel);
    background:var(--azul);
    border:none;
    padding:12px 28px;
    border-radius:2px;
    cursor:pointer;
    transition: background .15s ease;
  }
  button#reiniciar:hover{ background:var(--azul-destaque); }
  button#reiniciar:focus-visible{ outline:2px solid var(--laranja); outline-offset:2px; }

  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
  }

  @media (prefers-reduced-motion: reduce){
    .celula.marcando{ animation:none; }
    .linha-vitoria.ativa{ transition:none; }
  }

  @media (max-width:480px){
    header{ padding:22px 20px 18px; }
    .placar{ padding:18px 16px 6px; }
    .tabuleiro-wrap{ padding:4px 16px 22px; }
    .controles{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<main class="folha">
  <header>
    <p class="eyebrow">UNIVERSIDADE DE FORTALEZA</p>
    <h1>JOGO DA VELHA</h1>
    <button class="alterna-tema" id="alternaTema" type="button" aria-label="Alternar para modo escuro" title="Alternar modo escuro">🌙</button>
  </header>

  <div class="controles">
    <div class="campo">
      <label for="modoSelect">Modo de Jogo</label>
      <select id="modoSelect">
        <option value="pvp">2 Jogadores</option>
        <option value="cpu">Contra o Computador</option>
      </select>
    </div>
    <div class="campo" id="campoDificuldade">
      <label for="dificuldadeSelect">Dificuldade</label>
      <select id="dificuldadeSelect">
        <option value="facil">Fácil</option>
        <option value="medio" selected>Médio</option>
        <option value="dificil">Difícil</option>
      </select>
    </div>
    <div class="campo">
      <label for="formatoSelect">Formato da Partida</label>
      <select id="formatoSelect">
        <option value="single">Partida Única</option>
        <option value="bo3">Melhor de 3 (MD3)</option>
      </select>
    </div>
  </div>

  <div class="placar">
    <div class="jogador x" id="jogadorXBox">
      <div class="rotulo" id="rotuloX">JOGADOR X</div>
      <div class="valor" id="placarX">0</div>
    </div>
    <div class="rodada">
      <div class="rotulo">RODADA</div>
      <div class="valor" id="rodadaAtual">1/1</div>
    </div>
    <div class="jogador o" id="jogadorOBox">
      <div class="rotulo" id="rotuloO">JOGADOR O</div>
      <div class="valor" id="placarO">0</div>
    </div>
  </div>

  <p class="status" id="status">Vez do Jogador X</p>

  <div class="tabuleiro-wrap">
    <div class="tabuleiro" id="tabuleiro">
      <div class="linha-vitoria" id="linhaVitoria"></div>
      <button class="celula" data-i="0"></button>
      <button class="celula" data-i="1"></button>
      <button class="celula" data-i="2"></button>
      <button class="celula" data-i="3"></button>
      <button class="celula" data-i="4"></button>
      <button class="celula" data-i="5"></button>
      <button class="celula" data-i="6"></button>
      <button class="celula" data-i="7"></button>
      <button class="celula" data-i="8"></button>
    </div>
  </div>

  <div class="rodape">
    <button id="reiniciar">REINICIAR JOGO</button>
  </div>
</main>

<script>
(function(){
  "use strict";

  // ---------- Estado ----------
  let options = ['', '', '', '', '', '', '', '', ''];
  let currentPlayer = 'X';
  let running = false;
  let winsX = 0;
  let winsO = 0;
  let currentRound = 1;
  let modeSelect = 'pvp';
  let formatSelect = 'single';
  let dificuldadeSelect = 'medio';
  let cpuLock = false;

  const winPatterns = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  // ---------- Elementos ----------
  const modoSelect = document.getElementById('modoSelect');
  const formatoSelect = document.getElementById('formatoSelect');
  const dificuldadeSel = document.getElementById('dificuldadeSelect');
  const campoDificuldade = document.getElementById('campoDificuldade');
  const placarXEl = document.getElementById('placarX');
  const placarOEl = document.getElementById('placarO');
  const rotuloOEl = document.getElementById('rotuloO');
  const jogadorXBox = document.getElementById('jogadorXBox');
  const jogadorOBox = document.getElementById('jogadorOBox');
  const rodadaEl = document.getElementById('rodadaAtual');
  const statusEl = document.getElementById('status');
  const tabuleiroEl = document.getElementById('tabuleiro');
  const celulas = Array.from(document.querySelectorAll('.celula'));
  const linhaVitoriaEl = document.getElementById('linhaVitoria');
  const reiniciarBtn = document.getElementById('reiniciar');
  const alternaTemaBtn = document.getElementById('alternaTema');

  // ---------- Modo escuro ----------
  function aplicarTema(escuro){
    document.documentElement.classList.toggle('escuro', escuro);
    alternaTemaBtn.textContent = escuro ? '☀️' : '🌙';
    alternaTemaBtn.setAttribute('aria-label', escuro ? 'Alternar para modo claro' : 'Alternar para modo escuro');
    alternaTemaBtn.title = escuro ? 'Alternar modo claro' : 'Alternar modo escuro';
  }

  const preferEscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  aplicarTema(preferEscuro);

  alternaTemaBtn.addEventListener('click', ()=>{
    const escuroAtivo = document.documentElement.classList.contains('escuro');
    aplicarTema(!escuroAtivo);
  });

  // ---------- Áudio (Web Audio API, sem arquivos) ----------
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, start, duration, type, gainPeak){
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
    gain.gain.setValueAtTime(0, ctx.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.18, ctx.currentTime + start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + duration + 0.05);
  }

  function somX(){ tone(523.25, 0, 0.14, 'triangle'); }
  function somO(){ tone(392.00, 0, 0.14, 'sine'); }
  function somVitoria(){
    [523.25, 659.25, 783.99, 1046.50].forEach((f,i)=> tone(f, i*0.07, 0.4, 'triangle', 0.16));
  }
  function somEmpate(){
    [392.00, 329.63, 261.63].forEach((f,i)=> tone(f, i*0.09, 0.35, 'sawtooth', 0.1));
  }

  // ---------- Confete ----------
  const canvas = document.getElementById('confetti-canvas');
  const ctx2d = canvas.getContext('2d');
  let confetes = [];
  let confettiRunning = false;
  const coresConfete = ['#003366', '#0056b3', '#d97706', '#f4b183'];

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function dispararConfetes(){
    confetes = [];
    const n = 140;
    for(let i=0;i<n;i++){
      confetes.push({
        x: canvas.width/2 + (Math.random()-0.5)*140,
        y: canvas.height*0.28 + (Math.random()-0.5)*40,
        vx: (Math.random()-0.5)*8,
        vy: -Math.random()*9 - 4,
        g: 0.22 + Math.random()*0.08,
        size: 5 + Math.random()*5,
        cor: coresConfete[Math.floor(Math.random()*coresConfete.length)],
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*14,
        vida: 0
      });
    }
    if(!confettiRunning){
      confettiRunning = true;
      requestAnimationFrame(animarConfetes);
    }
  }

  function animarConfetes(){
    ctx2d.clearRect(0,0,canvas.width, canvas.height);
    let vivos = false;
    for(const p of confetes){
      p.vida++;
      p.vx *= 0.995;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if(p.y < canvas.height + 20 && p.vida < 260){
        vivos = true;
        ctx2d.save();
        ctx2d.translate(p.x, p.y);
        ctx2d.rotate(p.rot * Math.PI/180);
        ctx2d.fillStyle = p.cor;
        ctx2d.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
        ctx2d.restore();
      }
    }
    if(vivos){
      requestAnimationFrame(animarConfetes);
    } else {
      confettiRunning = false;
      ctx2d.clearRect(0,0,canvas.width, canvas.height);
    }
  }

  // ---------- Lógica de UI ----------
  function rotuloJogadorO(){
    return modeSelect === 'cpu' ? 'COMPUTADOR' : 'JOGADOR O';
  }

  function totalRodadas(){
    return formatSelect === 'bo3' ? 3 : 1;
  }

  function atualizarPlacarUI(){
    placarXEl.textContent = winsX;
    placarOEl.textContent = winsO;
    rotuloOEl.textContent = rotuloJogadorO();
    rodadaEl.textContent = currentRound + '/' + totalRodadas();
  }

  function atualizarIndicadorTurno(){
    jogadorXBox.classList.toggle('ativo', running && currentPlayer === 'X');
    jogadorOBox.classList.toggle('ativo', running && currentPlayer === 'O');
  }

  function definirStatus(texto, classe){
    statusEl.textContent = texto;
    statusEl.className = 'status' + (classe ? ' ' + classe : '');
  }

  function esconderLinhaVitoria(){
    linhaVitoriaEl.classList.remove('ativa');
    linhaVitoriaEl.style.width = '0px';
  }

  function tracarLinhaVitoria(padrao){
    const [a,b,c] = padrao;
    const elA = celulas[a].getBoundingClientRect();
    const elC = celulas[c].getBoundingClientRect();
    const wrapRect = tabuleiroEl.getBoundingClientRect();

    const x1 = elA.left + elA.width/2 - wrapRect.left;
    const y1 = elA.top + elA.height/2 - wrapRect.top;
    const x2 = elC.left + elC.width/2 - wrapRect.left;
    const y2 = elC.top + elC.height/2 - wrapRect.top;

    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.sqrt(dx*dx + dy*dy) + 26;
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;

    linhaVitoriaEl.style.left = (x1 - 13) + 'px';
    linhaVitoriaEl.style.top = (y1 - 3) + 'px';
    linhaVitoriaEl.style.transform = 'rotate(' + ang + 'deg)';
    linhaVitoriaEl.style.width = '0px';
    linhaVitoriaEl.classList.add('ativa');
    requestAnimationFrame(()=>{
      linhaVitoriaEl.style.width = dist + 'px';
    });
  }

  function limparTabuleiroDOM(){
    celulas.forEach(c=>{
      c.textContent = '';
      c.removeAttribute('data-s');
      c.classList.remove('ocupada', 'marcando');
    });
    esconderLinhaVitoria();
  }

  // ---------- Lógica de jogo ----------
  function iniciarPartida(){
    options = ['', '', '', '', '', '', '', '', ''];
    currentPlayer = 'X';
    running = true;
    winsX = 0;
    winsO = 0;
    currentRound = 1;
    cpuLock = false;
    limparTabuleiroDOM();
    atualizarPlacarUI();
    definirStatus('Vez do Jogador X');
    atualizarIndicadorTurno();
  }

  function iniciarNovaRodada(){
    options = ['', '', '', '', '', '', '', '', ''];
    currentPlayer = 'X';
    running = true;
    cpuLock = false;
    limparTabuleiroDOM();
    atualizarPlacarUI();
    definirStatus('Vez do Jogador X');
    atualizarIndicadorTurno();
  }

  function checarVencedor(){
    for(const padrao of winPatterns){
      const [a,b,c] = padrao;
      if(options[a] && options[a] === options[b] && options[a] === options[c]){
        return { vencedor: options[a], padrao };
      }
    }
    if(options.every(v => v !== '')){
      return { empate: true };
    }
    return null;
  }

  // ---------- IA da CPU (minimax — joga sempre a melhor jogada possível) ----------
  function vencedorNoTabuleiro(tab){
    for(const [a,b,c] of winPatterns){
      if(tab[a] && tab[a] === tab[b] && tab[a] === tab[c]) return tab[a];
    }
    return null;
  }

  function minimax(tab, jogadorDaVez, profundidade){
    const vencedor = vencedorNoTabuleiro(tab);
    if(vencedor === 'O') return 10 - profundidade;
    if(vencedor === 'X') return profundidade - 10;
    if(tab.every(v => v !== '')) return 0;

    const vazios = tab.map((v,i)=> v === '' ? i : null).filter(i => i !== null);

    if(jogadorDaVez === 'O'){
      let melhor = -Infinity;
      for(const i of vazios){
        tab[i] = 'O';
        melhor = Math.max(melhor, minimax(tab, 'X', profundidade + 1));
        tab[i] = '';
      }
      return melhor;
    } else {
      let pior = Infinity;
      for(const i of vazios){
        tab[i] = 'X';
        pior = Math.min(pior, minimax(tab, 'O', profundidade + 1));
        tab[i] = '';
      }
      return pior;
    }
  }

  function melhorJogadaCPU(tabAtual){
    const vazios = tabAtual.map((v,i)=> v === '' ? i : null).filter(i => i !== null);
    let melhorScore = -Infinity;
    let melhorIndice = vazios[0];
    for(const i of vazios){
      tabAtual[i] = 'O';
      const score = minimax(tabAtual, 'X', 0);
      tabAtual[i] = '';
      if(score > melhorScore){
        melhorScore = score;
        melhorIndice = i;
      }
    }
    return melhorIndice;
  }

  function escolherJogadaCPU(nivel, tabuleiro){
    const vazios = tabuleiro.map((v,i)=> v === '' ? i : null).filter(i => i !== null);

    if(nivel === 'facil'){
      // Fácil: joga de forma totalmente aleatória, sem estratégia.
      return vazios[Math.floor(Math.random() * vazios.length)];
    }

    if(nivel === 'medio'){
      // Médio: aproveita vitória imediata e bloqueia vitória imediata do adversário,
      // mas não planeja jogadas futuras — pode ser vencido com boa estratégia.
      for(const i of vazios){
        const copia = tabuleiro.slice();
        copia[i] = 'O';
        if(vencedorNoTabuleiro(copia) === 'O') return i;
      }
      for(const i of vazios){
        const copia = tabuleiro.slice();
        copia[i] = 'X';
        if(vencedorNoTabuleiro(copia) === 'X') return i;
      }
      if(tabuleiro[4] === '' && Math.random() < 0.5) return 4;
      return vazios[Math.floor(Math.random() * vazios.length)];
    }

    // Difícil: minimax completo — jogada sempre ótima, imbatível.
    return melhorJogadaCPU(tabuleiro.slice());
  }

  function marcarCelula(indice){
    options[indice] = currentPlayer;
    const el = celulas[indice];
    el.textContent = currentPlayer;
    el.dataset.s = currentPlayer;
    el.classList.add('ocupada', 'marcando');

    if(currentPlayer === 'X') somX(); else somO();

    const resultado = checarVencedor();

    if(resultado && resultado.vencedor){
      running = false;
      tracarLinhaVitoria(resultado.padrao);
      dispararConfetes();
      somVitoria();

      if(resultado.vencedor === 'X') winsX++; else winsO++;
      atualizarPlacarUI();

      const nomeVencedor = resultado.vencedor === 'X' ? 'Jogador X' : (modeSelect === 'cpu' ? 'Computador' : 'Jogador O');

      if(formatSelect === 'bo3'){
        if(winsX >= 2 || winsO >= 2){
          definirStatus(nomeVencedor + ' é o campeão da partida! 🏆', 'vitoria');
          atualizarIndicadorTurno();
        } else if(currentRound < 3){
          definirStatus(nomeVencedor + ' venceu a rodada!', 'vitoria');
          atualizarIndicadorTurno();
          setTimeout(()=>{
            currentRound++;
            iniciarNovaRodada();
          }, 2000);
        } else {
          definirStatus(nomeVencedor + ' venceu a última rodada!', 'vitoria');
          atualizarIndicadorTurno();
        }
      } else {
        definirStatus(nomeVencedor + ' venceu a partida!', 'vitoria');
        atualizarIndicadorTurno();
      }
      return;
    }

    if(resultado && resultado.empate){
      running = false;
      somEmpate();
      definirStatus('Rodada Empatada!', 'empate');
      atualizarIndicadorTurno();

      if(formatSelect === 'bo3' && currentRound < 3){
        setTimeout(()=>{
          iniciarNovaRodada();
        }, 2000);
      }
      return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    definirStatus('Vez do Jogador ' + currentPlayer + (modeSelect === 'cpu' && currentPlayer === 'O' ? ' (Computador)' : ''));
    atualizarIndicadorTurno();

    if(modeSelect === 'cpu' && currentPlayer === 'O' && running){
      jogadaComputador();
    }
  }

  function jogadaComputador(){
    cpuLock = true;
    setTimeout(()=>{
      if(!running) { cpuLock = false; return; }
      const vazias = options
        .map((v,i)=> v === '' ? i : null)
        .filter(i => i !== null);
      if(vazias.length === 0) { cpuLock = false; return; }
      const escolha = escolherJogadaCPU(dificuldadeSelect, options);
      cpuLock = false;
      marcarCelula(escolha);
    }, 400);
  }

  function tratarCliqueCelula(e){
    const indice = Number(e.currentTarget.dataset.i);
    if(!running) return;
    if(cpuLock) return;
    if(modeSelect === 'cpu' && currentPlayer === 'O') return;
    if(options[indice] !== '') return;
    marcarCelula(indice);
  }

  // ---------- Eventos ----------
  celulas.forEach(c => c.addEventListener('click', tratarCliqueCelula));

  reiniciarBtn.addEventListener('click', ()=>{
    iniciarPartida();
  });

  function atualizarVisibilidadeDificuldade(){
    campoDificuldade.classList.toggle('oculto', modeSelect !== 'cpu');
  }

  modoSelect.addEventListener('change', ()=>{
    modeSelect = modoSelect.value;
    atualizarVisibilidadeDificuldade();
    iniciarPartida();
  });

  formatoSelect.addEventListener('change', ()=>{
    formatSelect = formatoSelect.value;
    iniciarPartida();
  });

  dificuldadeSel.addEventListener('change', ()=>{
    dificuldadeSelect = dificuldadeSel.value;
    iniciarPartida();
  });

  atualizarVisibilidadeDificuldade();

  // ---------- Início ----------
  iniciarPartida();
})();
</script>

</body>
</html>
